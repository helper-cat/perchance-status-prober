# External 24/7 prober — GitHub Actions path.
#
# Copy this file to  .github/workflows/perchance-status.yml  in a repo you own
# (a tiny public repo is ideal). It runs every 5 minutes, probes the Perchance
# endpoints, and publishes the JSON feed the status page ingests.
#
# The feed is kept on its own orphan branch (`prober-data`) as a single amended
# commit that is force-pushed each run, so the repo does not accumulate ~288
# commits/day of history bloat. The page then reads the feed from:
#
#   https://raw.githubusercontent.com/<you>/<repo>/prober-data/data/probes.json
#
# Paste that URL into the page's "24/7 coverage" card. GitHub serves raw files
# public + gzip-compressed, and ignores the `?since=` query the page may append.
#
# Each run ALSO refreshes standalone SVG badges under data/badges/, so a README
# can link one by URL and have it stay current on its own:
#
#   https://raw.githubusercontent.com/<you>/<repo>/prober-data/data/badges/overall.svg
#
# Available files: overall.svg, services.svg, uptime.svg, latency.svg, graph.svg,
# plus svc-<key>.svg and up-<key>.svg for each check (e.g. svc-upload.svg). The
# page's #badge page can generate the Markdown for you once the feed URL is set.
#
# The prober's store is cumulative, and the job starts from a fresh checkout, so
# an early step pulls the previous feed back from prober-data before probing —
# without it the history (and the uptime badges, which need >=5 samples) resets
# every run.
#
# Notes:
#  - Actions cron is best-effort: runs can be delayed a few minutes under load.
#  - If the default branch is protected, force-pushing a *different* branch is
#    still fine — just don't protect `prober-data`.
#  - Prefer no-repo hosting? Use cloudflare-worker.js instead (free, KV-backed,
#    and it can serve the `?since=` delta).

name: perchance-status-prober

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perchance-status-prober
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Restore the previous feed
        # The prober's store is CUMULATIVE — each run loads the last feed, folds
        # in one new sample per endpoint, prunes, and rewrites it. But the job
        # starts from a fresh checkout of the default branch, where that feed
        # doesn't exist, so it has to be fetched back from the prober-data
        # branch first. Without this step the store resets every run: the feed
        # would only ever hold the single most recent minute, and the 24h/7d/120d
        # history (plus any uptime badge, which needs >=5 samples) stays empty.
        run: |
          mkdir -p data
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/prober-data/data/probes.json" -o data/probes.json || true

      - name: Probe Perchance endpoints
        env:
          PROBER_NAME: github-actions
          PROBER_REGION: "US"
          PROBER_INTERVAL_SEC: "300"
        run: node src/prober/probe.mjs data/probes.json

      - name: Publish feed + hosted badges to the prober-data branch
        run: |
          set -euo pipefail
          git config user.name  "perchance-status-prober"
          git config user.email "actions@users.noreply.github.com"
          # Stash the output outside the worktree, then publish it fresh on the
          # orphan branch so history does not grow ~288 commits/day.
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp -r data /tmp/pub/data
          git checkout --orphan prober-data
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/pub/data data
          git add -A
          git commit -m "probe feed + badges $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin prober-data
